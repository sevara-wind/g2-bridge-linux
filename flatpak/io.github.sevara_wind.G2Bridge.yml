app-id: io.github.sevara_wind.G2Bridge
runtime: org.gnome.Platform
runtime-version: '49'
sdk: org.gnome.Sdk
command: g2-bridge-flatpak

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=all
  - --filesystem=xdg-run/pipewire-0
  - --filesystem=/run/udev:ro
  - --filesystem=xdg-data/g2-bridge:create
  - --filesystem=xdg-config/g2-bridge:create
  - --filesystem=xdg-cache/g2-bridge:create
  - --talk-name=org.freedesktop.portal.Desktop
  - --talk-name=org.freedesktop.Flatpak
  - --talk-name=org.gnome.ScreenSaver
  - --talk-name=org.gnome.Mutter.DisplayConfig
  - --talk-name=org.kde.kglobalaccel
  - --talk-name=org.kde.Solid.PowerManagement
  - --env=PYTHONUNBUFFERED=1
  - --env=GST_DEBUG=0

modules:
  - name: g2-bridge
    buildsystem: simple
    build-commands:
      - mkdir -p /app/share/g2-bridge /app/bin
      - cp -a goggles_bridge scripts vendor /app/share/g2-bridge/
      - if [ -d bin ]; then cp -a bin/. /app/bin/ || true; fi
      - if [ -x /usr/bin/gst-launch-1.0 ]; then install -Dm755 /usr/bin/gst-launch-1.0 /app/bin/gst-launch-1.0; fi
      - if [ -x /usr/bin/gst-inspect-1.0 ]; then install -Dm755 /usr/bin/gst-inspect-1.0 /app/bin/gst-inspect-1.0; fi
      - install -Dm755 flatpak/g2-bridge-flatpak /app/bin/g2-bridge-flatpak
      - install -Dm644 flatpak/io.github.sevara_wind.G2Bridge.desktop /app/share/applications/io.github.sevara_wind.G2Bridge.desktop
      - install -Dm644 flatpak/io.github.sevara_wind.G2Bridge.metainfo.xml /app/share/metainfo/io.github.sevara_wind.G2Bridge.metainfo.xml
      - install -Dm644 flatpak/io.github.sevara_wind.G2Bridge.svg /app/share/icons/hicolor/scalable/apps/io.github.sevara_wind.G2Bridge.svg
    sources:
      - type: git
        url: https://github.com/sevara-wind/g2-bridge-linux.git
        commit: 8501d2d036b03feefcd1cbd265db4e28be6aa301
